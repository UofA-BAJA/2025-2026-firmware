;Arduino Nano Normal:
[env:nanoatmega328new]
build_flags = 
	-D CANT_ARDUINO
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = 
	coryjfowler/mcp_can@^1.5.1
	symlink://../../src/Onboard/CANTProtocol

